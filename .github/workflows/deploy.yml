name: Deploy CI4 to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploying to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      # Pembersihan service Google API agar tidak bengkak
      - name: Cleanup Unused Google Services
        run: |
          php -r '
            $servicesDir = "vendor/google/apiclient-services/src";
            if (is_dir($servicesDir)) {
                $keep = ["Drive.php", "Drive", "Oauth2.php", "Oauth2"];
                $files = glob($servicesDir . "/*");
                foreach ($files as $file) {
                    $name = basename($file);
                    if (!in_array($name, $keep)) {
                        if (is_dir($file)) {
                            exec("rm -rf " . escapeshellarg($file));
                        } else {
                            @unlink($file);
                        }
                    }
                }
            }
          '

      - name: Sync files via FTP
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./htdocs/
          # Paksa upload ulang file yang hilang/berbeda
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/writable/debugbar/**
            .env